version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=stonescanner_super_secret_jwt_key_2026
      - IDENTITY_SERVICE_URL=http://identity-service:4001
      - SCAN_SERVICE_URL=http://scan-service:5001
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:5002
      - MARKETPLACE_SERVICE_URL=http://marketplace-service:4002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  identity-service:
    build: ./services/identity-service
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - POSTGRES_URL=postgres://stonescanner_user:stonescanner_pass@postgres:5432/stonescanner_db
      - JWT_SECRET=stonescanner_super_secret_jwt_key_2026
    depends_on:
      - postgres

  scan-service:
    build: ./services/scan-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - AI_INFERENCE_URL=http://ai-inference-service:5003
      - REDIS_URL=redis://redis:6379

  ai-inference-service:
    build: ./services/ai-inference-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MODEL_MODE=ENSEMBLE_HYBRID

  knowledge-service:
    build: ./services/knowledge-graph-svc
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=stonescanner_graph_pass

  marketplace-service:
    build: ./services/marketplace-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - POSTGRES_URL=postgres://stonescanner_user:stonescanner_pass@postgres:5432/stonescanner_db

  postgres:
    image: postgres:15-alpine
    container_name: stonescanner_postgres
    environment:
      POSTGRES_USER: stonescanner_user
      POSTGRES_PASSWORD: stonescanner_pass
      POSTGRES_DB: stonescanner_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database-schemas/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5.11-community
    container_name: stonescanner_neo4j
    environment:
      NEO4J_AUTH: neo4j/stonescanner_graph_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  redis:
    image: redis:7-alpine
    container_name: stonescanner_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
  neo4jdata:
